services:
  web:
    image: node:22
    working_dir: /app/my-project/play
    command:
      - sh
      - -ec
      - |
        npm ci --no-audit --no-fund
        exec npx vite --host 0.0.0.0 --port 3000 --strictPort
    environment:
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - CHOKIDAR_USEPOLLING=1
    ports:
      - "3000:3000"
    labels:
      base44.project: play
      base44.kind: web
      base44.port: "3000"
    volumes:
      - .:/app
      - /app/my-project/play/node_modules
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s
