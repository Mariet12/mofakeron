# Base44 dev environment for the Vite + React app in ./my-project/play
# Runs the app straight from the cloned source with Vite's dev server + HMR.
services:
  web:
    image: node:22
    working_dir: /app
    ports:
      - "3000:5173"
    labels:
      base44.project: "play"
      base44.kind: "web"
      base44.port: "3000"
    restart: on-failure
    environment:
      # Vite >= 6.1 appends this platform-set list to server.allowedHosts.
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - BASE44_PREVIEW_MODE
    volumes:
      - ./my-project/play:/app
      - node_modules:/app/node_modules
    command:
      [
        "sh",
        "-ec",
        "CI=true npm ci --no-audit --no-fund && exec npm run dev -- --host 0.0.0.0 --port 5173",
      ]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 120s

volumes:
  node_modules:
